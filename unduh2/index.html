<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih — Unduh-Unduh Bulan Keluarga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta name="description" content="Unduh - Unduh Bulan Keluarga 4 Oktober 2026 GKI Sepanjang">


    <meta property="og:url" content="https://galaparadi.github.io/unduh2">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Unduh - Unduh Bulan Keluarga 4 Oktober 2026 GKI Sepanjang">
    <meta property="og:description"
        content="Terima kasih telah berpartisipasi dalam kegiatan Unduh - Unduh Bulan Keluarga 4 Oktober 2026 di GKI Sepanjang">
    <meta property="og:image" content="https://galaparadi.github.io/unduh2/banner.jpeg">


    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="galaparadi.github.io">
    <meta property="twitter:url" content="https://galaparadi.github.io/unduh2">
    <meta name="twitter:title" content="Unduh - Unduh Bulan Keluarga 4 Oktober 2026 GKI Sepanjang">
    <meta name="twitter:description"
        content="Terima kasih telah berpartisipasi dalam kegiatan Unduh - Unduh Bulan Keluarga 4 Oktober 2026 di GKI Sepanjang">
    <meta name="twitter:image" content="https://galaparadi.github.io/unduh2/banner.jpeg">
    <style>
        :root {
            --bg: #FAFAF8;
            --panel: #FFFFFF;
            --ink: #14181C;
            --muted: #6B7280;
            --line: #E4E1DA;
            --accent: #1F5F4F;
            --accent-soft: #E8F0EE;
            --radius: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 48px;
            border-bottom: 1px solid var(--line);
        }

        .topbar-logo {
            height: 52px;
            width: 160px;
            background-color: var(--accent);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: contain;
            mask-size: contain;
        }

        .topbar-logo.phbg {
            -webkit-mask-image: url('/img/phbg.png');
            mask-image: url('/img/phbg.png');
        }

        .topbar-logo.gki {
            -webkit-mask-image: url('/img/gki-sepanjang.png');
            mask-image: url('/img/gki-sepanjang.png');
        }

        main {
            max-width: 1520px;
            width: 100%;
            margin: auto;
            padding: 48px 64px 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thanks-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 560px;
            padding: 40px 24px;
        }

        .thanks-card .icon {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        .thanks-card .icon svg {
            width: 38px;
            height: 38px;
        }

        .thanks-title {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 56px;
            line-height: 1.1;
            letter-spacing: -0.01em;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .thanks-desc {
            font-size: 18px;
            color: var(--ink);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .thanks-meta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: var(--muted);
            padding-top: 24px;
            border-top: 1px solid var(--line);
            width: 100%;
            justify-content: center;
        }

        .thanks-meta b {
            color: var(--ink);
            font-weight: 500;
        }

         
        .thanks-total {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid var(--line);
            width: 100%;
        }

        .thanks-total-label {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .thanks-total-value {
            font-family: 'Fraunces', serif;
            font-size: 40px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: -0.01em;
        }

        @media (max-width: 860px) {
            main {
                padding: 32px 20px 60px;
            }

            .topbar {
                padding: 16px 20px;
            }

            .topbar-logo {
                height: 36px;
                width: 110px;
            }

            .thanks-card .icon {
                width: 64px;
                height: 64px;
                margin-bottom: 24px;
            }

            .thanks-card .icon svg {
                width: 28px;
                height: 28px;
            }

            .thanks-title {
                font-size: 34px;
            }

            .thanks-desc {
                font-size: 16px;
            }

            .thanks-total-value {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="topbar-logo phbg" role="img" aria-label="PHBG - Panitia Hari Besar Gerejawi"></div>
        <div class="topbar-logo gki" role="img" aria-label="GKI Sepanjang"></div>
    </div>

    <main>
        <div class="thanks-card">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z" />
                </svg>
            </div>

            <h1 class="thanks-title">Terima Kasih!</h1>

            <p class="thanks-desc">
                Terima kasih atas partisipasi dan dukungan Bapak/Ibu/Saudara/i dalam acara lelang Unduh-Unduh Bulan
                Keluarga GKI Sepanjang. Setiap tawaran dan keikutsertaan menjadi berkat bagi pelayanan gereja.
            </p>

            <div class="thanks-meta">
                <span>Unduh-Unduh Bulan Keluarga</span>
                <span>·</span>
                <span><b>4 Oktober 2026</b></span>
            </div>

            

            <div class="thanks-total">
                <div class="thanks-total-label">Total penghasilan lelang</div>
                <div class="thanks-total-value">Rp. 20.335.000</div>
                
            </div>
        </div>
    </main>

</body>

</html>
