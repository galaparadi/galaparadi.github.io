<head>
  <meta charset="UTF-8">

  <meta name="twitter:card" content="summary_large_image">

  <meta property="twitter:url" content="">

  <meta name="twitter:image" content="../photos/stock-01M41307VDVVCGJJX9CK3Q0Y92.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8;
      --panel: #FFFFFF;
      --ink: #14181C;
      --muted: #6B7280;
      --line: #E4E1DA;
      --accent: #1F5F4F;
      --field-bg: #F4F3EF;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      border-bottom: 1px solid var(--line);
    }

    .topbar .brand {
      font-family: 'Fraunces', serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .topbar-logo {
      height: 52px;
      width: 160px;
      background-color: var(--accent);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .topbar-logo.phbg {
      -webkit-mask-image: url('../img/phbg.png');
      mask-image: url('../img/phbg.png');
    }

    .topbar-logo.gki {
      -webkit-mask-image: url('../img/gki_sepanjang.png');
      mask-image: url('../img/gki_sepanjang.png');
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 40px 100px;
    }

    .item-media {
      aspect-ratio: 4 / 3;
      background: var(--field-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }

    .item-media .media-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(28px) brightness(0.85);
      transform: scale(1.15);
      display: block;
    }

    .item-media .media-fg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .item-name {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }

    .price-label {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .price-value {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin-bottom: 24px;
    }

    .item-description {
      font-size: 14.5px;
      color: var(--ink);
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 16px 20px;
      }

      .topbar-logo {
        height: 36px;
        width: 110px;
      }

      main {
        padding: 28px 20px 80px;
      }

      .item-name {
        font-size: 21px;
      }

      .price-value {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-logo phbg" role="img" aria-label="PHBG - Panitia Hari Besar Gerejawi"></div>
    <div class="topbar-logo gki" role="img" aria-label="GKI Sepanjang"></div>
  </div>

  <main>
    <div class="item-media">
      <img class="media-bg" src="../photos/stock-01M41307VDVVCGJJX9CK3Q0Y92.jpg" alt="" aria-hidden="true">
      <img class="media-fg" src="../photos/stock-01M41307VDVVCGJJX9CK3Q0Y92.jpg" alt="Paket Sunlight">
    </div>

    <div class="item-name">Paket Sunlight</div>

    

    <div class="divider"></div>

    <div class="item-description">
      Paket pembersih piring
    </div>
  </main>

</body>

</html>
